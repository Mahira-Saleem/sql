<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Management System</title>
  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto bg-white shadow-lg p-6 rounded-lg">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Student Management System</h1>

    <!-- Student Form -->
    <form id="studentForm" class="mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
      <input type="hidden" id="studentId">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Student Name</label>
        <input type="text" id="name" placeholder="Enter name" required class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" placeholder="Enter email" required class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Course</label>
        <input type="text" id="course" placeholder="Enter course" required class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="md:col-span-3 flex gap-2">
        <button type="submit" id="submitBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Add Student</button>
        <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded">Cancel</button>
      </div>
    </form>

    <!-- Students Table -->
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white border border-gray-200">
        <thead>
          <tr class="bg-gray-100 border-b">
            <th class="py-2 px-4 text-left border text-gray-600">Name</th>
            <th class="py-2 px-4 text-left border text-gray-600">Email</th>
            <th class="py-2 px-4 text-left border text-gray-600">Course</th>
            <th class="py-2 px-4 text-center border text-gray-600">Actions</th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
        </tbody>
      </table>
    </div>
  </div>

  <!-- Supabase v2 CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
